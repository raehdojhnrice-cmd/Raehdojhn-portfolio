    .spread-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      z-index: 30;
      background: linear-gradient(
        105deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.14) 46%,
        rgba(255, 255, 255, 0.06) 52%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: translateX(-46%) skewX(-10deg);
      mix-blend-mode: screen;
    }
    .spread-container.is-flipping-forward::after {
      animation: page-sheen-forward 560ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .spread-container.is-flipping-back::after {
      animation: page-sheen-back 560ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .spread-container.is-flipping-forward .spread-card.active {
      animation: page-flex-forward 560ms cubic-bezier(0.2, 0.85, 0.32, 1);
    }
    .spread-container.is-flipping-back .spread-card.active {
      animation: page-flex-back 560ms cubic-bezier(0.2, 0.85, 0.32, 1);
    }
    @keyframes page-sheen-forward {
      0% {
        opacity: 0;
        transform: translateX(-48%) skewX(-10deg);
      }
      30% {
        opacity: 0.26;
      }
      100% {
        opacity: 0;
        transform: translateX(48%) skewX(-10deg);
      }
    }
    @keyframes page-sheen-back {
      0% {
        opacity: 0;
        transform: translateX(48%) skewX(10deg);
      }
      30% {
        opacity: 0.26;
      }
      100% {
        opacity: 0;
        transform: translateX(-48%) skewX(10deg);
      }
    }
    @keyframes page-flex-forward {
      0% {
        transform: translateX(0) rotateY(-8deg) scale(0.996);
      }
      56% {
        transform: translateX(0) rotateY(3deg) scale(1.002);
      }
      100% {
        transform: translateX(0) rotateY(0deg) scale(1);
      }
    }
    @keyframes page-flex-back {
      0% {
        transform: translateX(0) rotateY(8deg) scale(0.996);
      }
      56% {
        transform: translateX(0) rotateY(-3deg) scale(1.002);
      }
      100% {
        transform: translateX(0) rotateY(0deg) scale(1);
      }

      transform-style: preserve-3d;
    }

      transform: translateX(0) rotateY(0) scale(1);
      opacity: 1;
      z-index: 10;
    }
    .spread-card.before {

      opacity: 0;
      pointer-events: none;
    }
    .spread-card.after {
      transform: translateX(100px) rotateY(-15deg) scale(0.95);
      opacity: 0;
      pointer-events: none;
    }
    .fit-mode .spread-container {
      height: min(88vh, calc(98vw / var(--spread-ratio)));
      max-width: min(98vw, 1680px);
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .media-frame {

    const ISSUE_DATA = {
      project: {
        title: "RANAAN × CCC — Future Archives",
        subtitle: "Controlled Chaos Collection SS25"
      },
      spreads: []
    };

    let currentSpread = 0;
    let isFitMode = false;
    let flipFxTimer = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeText(text) {
      return String(text ?? "").toLowerCase();
    }

    function clampAspect(value, min = 0.35, max = 2.6) {
      const n = Number(value);
      if (!Number.isFinite(n) || n <= 0) return 1;
      return Math.min(max, Math.max(min, n));
    }

    function inferAspectFromName(fileName) {
      const name = normalizeText(fileName || "");
      const direct = name.match(/(\d{1,2})\s*[x:]\s*(\d{1,2})/i);
      if (direct) {
        const w = Number(direct[1]);
        const h = Number(direct[2]);
        if (w > 0 && h > 0) return clampAspect(w / h);
      }
      if (/16x9|landscape|horizontal/.test(name)) return 16 / 9;
      if (/9x16|portrait|vertical/.test(name)) return 9 / 16;
      if (/1x1|square/.test(name)) return 1;
      return 0.8;
    }

    function imageAspect(image) {
      return clampAspect(image?.aspectRatio || inferAspectFromName(image?.fileName || ""));
    }

    function getPageTitle(pageNumber) {
      return PAGE_TITLES[pageNumber - 1] || `Page ${pageNumber}`;
    }

    function buildImageSide(image, spreadIndex, sideName, pageNumber, pageTitle) {
      if (!image) {
        return {
          theme: sideName === "left" ? "dark" : "light",
          kicker: `Page ${String(pageNumber).padStart(3, "0")}`,
          pageTitle,
          title: "Archive\nComplete",
          body: "All image files from the RANAAN CCCC source folder have been included in this issue.",
          footer: "RANAAN CCCC / Full Image Set"
        };
      }

      const dark = (spreadIndex + (sideName === "left" ? 0 : 1)) % 2 === 0;
      return {
        theme: dark ? "dark" : "light",
        kicker: `Page ${String(pageNumber).padStart(3, "0")}`,
        pageTitle,
        media: image.src,
        mediaLabel: pageTitle || "Editorial image",
        mediaAspect: imageAspect(image),
        footer: image.chapter || "RANAAN CCCC"
      };
    }

    function buildAllImageSpreads(images) {
      const out = [];
      for (let i = 0; i < images.length; i += 2) {
        const index = Math.floor(i / 2);
        const leftPageNumber = i + 1;
        const rightPageNumber = i + 2;
        const leftPageTitle = getPageTitle(leftPageNumber);
        const rightPageTitle = getPageTitle(rightPageNumber);
        const left = images[i] || null;
        const right = images[i + 1] || null;
        out.push({
          id: `spread-${String(index + 1).padStart(3, "0")}`,
          thumbLabel: `${String(leftPageNumber).padStart(3, "0")} · ${leftPageTitle}`,
          left: buildImageSide(left, index, "left", leftPageNumber, leftPageTitle),
          right: buildImageSide(right, index, "right", rightPageNumber, rightPageTitle)
        });
      }
      return out;
    }

    function applyAllImagesToSpreads(manifestImages) {
      const deduped = [];
      const seen = new Set();

      for (const image of manifestImages) {
        if (!image || !image.src) continue;
        if (seen.has(image.id)) continue;
        seen.add(image.id);
        deduped.push(image);
      }

      ISSUE_DATA.spreads = buildAllImageSpreads(deduped);
    }

    function getSideAspect(side) {
      if (side?.media) return clampAspect(side.mediaAspect || 0.8);
      if (side?.title) return 0.72;
      return 0.8;
    }

    function getSpreadAspect(spread) {
      if (!spread) return 1.62;
      const left = getSideAspect(spread.left);
      const right = getSideAspect(spread.right);
      return clampAspect(left + right, 0.9, 4.6);
    }

    function updateViewportAspect() {
      const viewport = document.getElementById("spread-viewport");
      const activeSpread = ISSUE_DATA.spreads[currentSpread];
      if (!viewport || !activeSpread) return;
      viewport.style.setProperty("--spread-ratio", String(getSpreadAspect(activeSpread)));
    }

    function renderMediaFrame(side, shouldLoadMedia = true) {
      if (!side?.media) return "";
      const aspect = clampAspect(side.mediaAspect || 0.8);
      if (!shouldLoadMedia) {
        return `
          <div class="media-frame flex items-center justify-center p-3 text-[10px] uppercase tracking-[0.18em] opacity-55" style="--media-aspect:${aspect};">
            ${escapeHtml(side.mediaLabel || "Image")}
          </div>
        `;
      }
      return `
        <figure class="media-frame" style="--media-aspect:${aspect};">
          <img loading="lazy" decoding="async" src="${escapeHtml(side.media)}" alt="${escapeHtml(side.mediaLabel || "Editorial image")}" />
        </figure>
      `;
    }

    function renderDesktop() {
      const viewport = document.getElementById("spread-viewport");
      viewport.innerHTML = "";
      updateViewportAspect();

      ISSUE_DATA.spreads.forEach((spread, idx) => {
        const card = document.createElement("div");
        const spreadState =
          idx === currentSpread ? "active" : idx < currentSpread ? "before" : "after";
        const shouldLoadMedia = Math.abs(idx - currentSpread) <= 2;

        card.id = `spread-${idx}`;
        card.className = `spread-card absolute inset-0 grid grid-cols-2 bg-bone_cream rounded-2xl overflow-hidden shadow-2xl ${spreadState}`;
        card.style.gridTemplateColumns = `${getSideAspect(spread.left)}fr ${getSideAspect(spread.right)}fr`;

        const leftThemeDark = spread.left.theme === "dark";
        const rightThemeDark = spread.right.theme === "dark";
        const leftDisplayTitle = spread.left.pageTitle || spread.left.title || "";
        const rightDisplayTitle = spread.right.pageTitle || spread.right.title || "";

        card.innerHTML = `
          <div class="relative ${leftThemeDark ? "bg-void_black text-bone_cream" : "bg-bone_cream text-void_black"} p-10 flex flex-col justify-between border-r border-black/10">
            <div class="flex justify-between items-center opacity-50 text-[10px] uppercase tracking-widest">
              <span>${escapeHtml(spread.left.kicker || "")}</span>
              <span>${(idx * 2 + 1).toString().padStart(2, "0")}</span>
            </div>
            <div class="flex flex-col gap-6 min-h-0">
              ${leftDisplayTitle ? `<h2 class="font-bebas text-[clamp(1.7rem,2.4vw,3rem)] uppercase leading-[0.95]">${escapeHtml(leftDisplayTitle).replaceAll("\n", "<br>")}</h2>` : ""}
              ${renderMediaFrame(spread.left, shouldLoadMedia)}
              ${spread.left.deck ? `<p class="font-playfair italic text-lg opacity-80">${escapeHtml(spread.left.deck)}</p>` : ""}
              ${spread.left.quote ? `<blockquote class="font-playfair text-2xl italic leading-tight">${escapeHtml(spread.left.quote)}</blockquote>` : ""}
              ${spread.left.body ? `<p class="text-sm leading-relaxed opacity-70 max-w-prose">${escapeHtml(spread.left.body)}</p>` : ""}
            </div>
            <div class="text-[10px] uppercase tracking-widest opacity-40">${escapeHtml(spread.left.footer || "")}</div>
          </div>
          <div class="relative ${rightThemeDark ? "bg-void_black text-bone_cream" : "bg-bone_cream text-void_black"} p-10 flex flex-col justify-between">
            <div class="flex justify-between items-center opacity-50 text-[10px] uppercase tracking-widest">
              <span>${escapeHtml(spread.right.kicker || "")}</span>
              <span>${(idx * 2 + 2).toString().padStart(2, "0")}</span>
            </div>
            <div class="flex flex-col gap-6 h-full justify-center min-h-0">
              ${renderMediaFrame(spread.right, shouldLoadMedia)}
              ${rightDisplayTitle ? `<h2 class="font-bebas text-[clamp(1.7rem,2.4vw,3rem)] uppercase leading-[0.95]">${escapeHtml(rightDisplayTitle).replaceAll("\n", "<br>")}</h2>` : ""}
              ${spread.right.body ? `<p class="text-sm leading-relaxed opacity-70 max-w-prose">${escapeHtml(spread.right.body)}</p>` : ""}
            </div>
            <div class="text-[10px] uppercase tracking-widest opacity-40">${escapeHtml(spread.right.footer || "")}</div>
          </div>
        `;
        viewport.appendChild(card);
      });

      document.getElementById("spread-counter").innerText = `${(currentSpread + 1)
        .toString()
        .padStart(2, "0")} / ${ISSUE_DATA.spreads.length.toString().padStart(2, "0")}`;
    }

    function renderMobile() {
      const scroller = document.getElementById("mobile-scroller");
      scroller.innerHTML = "";
      if (window.innerWidth >= 768) return;

      ISSUE_DATA.spreads.forEach((spread, idx) => {
        const section = document.createElement("div");
        section.className = "space-y-4";
        section.innerHTML = `
          <div class="flex justify-between items-center px-1 gap-2">
            <span class="text-[10px] uppercase tracking-widest opacity-50 truncate">${escapeHtml(spread.thumbLabel)}</span>
            <span class="text-[10px] bg-white/10 px-2 py-1 rounded-md tracking-widest">${(idx + 1).toString().padStart(2, "0")}</span>
          </div>
          <div class="grid gap-4">
            ${renderMobileSide(spread.left, idx * 2 + 1)}
            ${renderMobileSide(spread.right, idx * 2 + 2)}
          </div>
        `;
        scroller.appendChild(section);
      });
    }

    function renderMobileSide(side, page) {
      const isDark = side.theme === "dark";
      const aspect = clampAspect(side.mediaAspect || 0.8);
      const displayTitle = side.pageTitle || side.title || "";
      return `
        <div class="${isDark ? "bg-void_black text-bone_cream" : "bg-bone_cream text-void_black"} rounded-3xl p-6 space-y-4 shadow-xl border border-white/10">
          <div class="flex justify-between opacity-50 text-[10px] uppercase tracking-widest">
            <span>${escapeHtml(side.kicker || "Archive")}</span>
            <span>${page.toString().padStart(2, "0")}</span>
          </div>
          ${side.media ? `<figure class="media-frame" style="--media-aspect:${aspect};"><img loading="lazy" decoding="async" src="${escapeHtml(side.media)}" alt="${escapeHtml(side.mediaLabel || "Editorial image")}" /></figure>` : ""}
          ${displayTitle ? `<h2 class="font-bebas text-4xl uppercase leading-none">${escapeHtml(displayTitle).replaceAll("\n", "<br>")}</h2>` : ""}
          ${side.deck ? `<p class="font-playfair italic text-lg opacity-80">${escapeHtml(side.deck)}</p>` : ""}
          ${side.body ? `<p class="text-sm leading-relaxed opacity-70">${escapeHtml(side.body)}</p>` : ""}
          <div class="pt-4 border-t border-current opacity-20 text-[10px] uppercase tracking-widest">${escapeHtml(side.footer || "")}</div>
        </div>
      `;
    }

    function renderToc() {
      const list = document.getElementById("toc-list");
      list.innerHTML = "";
      const totalPages = ISSUE_DATA.spreads.length * 2;
      for (let pageNumber = 1; pageNumber <= totalPages; pageNumber += 1) {
        const spreadIndex = Math.floor((pageNumber - 1) / 2);
        const pageTitle = getPageTitle(pageNumber);
        const sideLabel = pageNumber % 2 === 1 ? "Left Page" : "Right Page";
        const btn = document.createElement("button");
        btn.className = "flex justify-between items-center text-left border-b border-white/10 pb-4 group";
        btn.onclick = () => {
          mobileGoTo(spreadIndex);
          toggleToc();
        };
        btn.innerHTML = `
          <div class="min-w-0">
            <div class="text-[10px] uppercase tracking-[0.2em] opacity-40 mb-1">Page ${String(pageNumber).padStart(3, "0")} · Spread ${String(spreadIndex + 1).padStart(3, "0")} · ${sideLabel}</div>
            <div class="font-bebas text-2xl tracking-wide group-hover:pl-4 transition-all duration-300 truncate">${escapeHtml(pageTitle)}</div>
          </div>
          <div class="text-2xl opacity-20">→</div>
        `;
        list.appendChild(btn);
      }
    }

    function updateDesktopStats(stats) {
      document.getElementById("stat-files").innerText = `${stats.totalFiles || 0} files`;
      document.getElementById("stat-images").innerText = `${stats.totalImages || 0} images`;
      document.getElementById("stat-spreads").innerText = `${ISSUE_DATA.spreads.length} spreads`;
    }

    function triggerPageFlip(direction) {
      if (window.innerWidth < 768) return;
      const viewport = document.getElementById("spread-viewport");
      if (!viewport) return;

      const forwardClass = "is-flipping-forward";
      const backClass = "is-flipping-back";
      viewport.classList.remove(forwardClass, backClass);
      void viewport.offsetWidth;
      viewport.classList.add(direction === "forward" ? forwardClass : backClass);

      window.clearTimeout(flipFxTimer);
      flipFxTimer = window.setTimeout(() => {
        viewport.classList.remove(forwardClass, backClass);
      }, 620);
    }

    function nextSpread() {
      if (currentSpread < ISSUE_DATA.spreads.length - 1) {
        currentSpread += 1;
        renderDesktop();
        triggerPageFlip("forward");
      }
    }

    function prevSpread() {
      if (currentSpread > 0) {
        currentSpread -= 1;
        renderDesktop();
        triggerPageFlip("back");
      }
    }

    function mobileGoTo(idx) {
      const sections = document.getElementById("mobile-scroller").children;
      if (!sections[idx]) return;
      sections[idx].scrollIntoView({ behavior: "smooth" });
    }

    function toggleToc() {
      const overlay = document.getElementById("toc-overlay");
      overlay.classList.toggle("hidden");
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") nextSpread();
      if (e.key === "ArrowLeft") prevSpread();
      if (e.key.toLowerCase() === "f") {
        isFitMode = !isFitMode;
        document.getElementById("app").classList.toggle("fit-mode", isFitMode);
      }
      if (e.key.toLowerCase() === "t") {
        toggleToc();
      }
    });

    function isGestureNavigationEnabled() {
      const toc = document.getElementById("toc-overlay");
      const tocOpen = toc && !toc.classList.contains("hidden");
      return window.innerWidth >= 768 && !tocOpen;
    }

    function touchMidpoint(touches) {
      if (!touches || touches.length < 2) return { x: 0, y: 0 };
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    function installTwoFingerFlickNavigation() {
      const stage = document.getElementById("spread-viewport");
      if (!stage) return;

      const touchState = {
        active: false,
        startX: 0,
        startY: 0,
        triggered: false
      };
      let lastWheelFlickAt = 0;

      stage.addEventListener(
        "wheel",
        (event) => {
          if (!isGestureNavigationEnabled()) return;
          const absX = Math.abs(event.deltaX);
          const absY = Math.abs(event.deltaY);
          if (absX < 56 || absX < absY * 1.15) return;

          const now = Date.now();
          if (now - lastWheelFlickAt < 420) return;
          lastWheelFlickAt = now;

          event.preventDefault();
          if (event.deltaX > 0) {
            nextSpread();
          } else {
            prevSpread();
          }
        },
        { passive: false }
      );

      stage.addEventListener(
        "touchstart",
        (event) => {
          if (!isGestureNavigationEnabled()) return;
          if (event.touches.length !== 2) return;
          const mid = touchMidpoint(event.touches);
          touchState.active = true;
          touchState.startX = mid.x;
          touchState.startY = mid.y;
          touchState.triggered = false;
        },
        { passive: true }
      );

      stage.addEventListener(
        "touchmove",
        (event) => {
          if (!touchState.active || event.touches.length !== 2 || touchState.triggered) return;
          if (!isGestureNavigationEnabled()) return;

          const mid = touchMidpoint(event.touches);
          const dx = mid.x - touchState.startX;
          const dy = mid.y - touchState.startY;
          if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.2) return;

          touchState.triggered = true;
          event.preventDefault();
          if (dx < 0) {
            nextSpread();
          } else {
            prevSpread();
          }
        },
        { passive: false }
      );

      const clearTouch = () => {
        touchState.active = false;
        touchState.triggered = false;
      };
      stage.addEventListener("touchend", clearTouch, { passive: true });
      stage.addEventListener("touchcancel", clearTouch, { passive: true });
    }

    installTwoFingerFlickNavigation();

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        if (window.innerWidth >= 768) {
          renderDesktop();
        } else {
          renderMobile();
        }
      }, 120);
    });

    async function loadManifestAndRender() {
      let manifest = INLINE_MANIFEST;

      if (window.location.protocol !== "file:") {
        try {
          const response = await fetch("./manifest.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Manifest request failed (${response.status})`);
          }
          manifest = await response.json();
        } catch (error) {
          console.warn("Using embedded RANAAN CCC image manifest:", error);
        }
      }

      const images = Array.isArray(manifest.images) ? manifest.images : [];

      if (manifest.project?.title) ISSUE_DATA.project.title = manifest.project.title;
      if (manifest.project?.subtitle) ISSUE_DATA.project.subtitle = manifest.project.subtitle;

      if (images.length > 0) {
        applyAllImagesToSpreads(images);
      } else {
        ISSUE_DATA.spreads = JSON.parse(JSON.stringify(BASE_SPREADS));
      }

      document.getElementById("project-title").innerText = ISSUE_DATA.project.title;
      document.getElementById("project-title-mobile").innerText = ISSUE_DATA.project.title;
      document.getElementById("project-subtitle").innerText = ISSUE_DATA.project.subtitle || "Future Archives";

      updateDesktopStats(manifest.stats || { totalFiles: images.length, totalImages: images.length });
      renderDesktop();
      renderMobile();
      renderToc();
    }

    loadManifestAndRender();
  </script>
</body>
</html>
